name: Refresh and validate game covers
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    paths:
      - 'scripts/refresh_covers.py'
      - '.github/workflows/refresh-covers.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify game titles and find Steam covers
        run: python scripts/refresh_covers.py
      - name: Commit matched covers and refreshed embedded catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json index.html
          git diff --cached --quiet || (git commit -m "Refresh Steam game cover matches" && git push)
