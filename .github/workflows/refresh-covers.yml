name: Refresh and validate game covers
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Discover PS5-PC crossplay candidates"]
    types: [completed]
  schedule:
    - cron: '17 4 * * 1'
  push:
    paths:
      - 'scripts/refresh_covers.py'
      - '.github/workflows/refresh-covers.yml'
permissions:
  contents: write
concurrency:
  group: crossplay-catalog-writer
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax before making requests
        run: python -m py_compile scripts/refresh_covers.py
      - name: Identify game titles and validate cover bytes across sources
        run: python scripts/refresh_covers.py
      - name: Commit matched covers and refreshed embedded catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json index.html data/cover-audit.txt data/cover-audit.json
          git diff --cached --quiet || (git commit -m "Refresh Steam game cover matches" && git pull --rebase origin main && git push origin HEAD:main)
