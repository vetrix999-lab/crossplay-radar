name: Discover PS5-PC crossplay candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '51 5 * * 4'
  push:
    paths:
      - 'scripts/discover_pair_candidates.py'
      - '.github/workflows/discover-games.yml'
permissions:
  contents: write
concurrency:
  group: crossplay-catalog-writer
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile discovery
        run: python -m py_compile scripts/discover_pair_candidates.py
      - name: Discover and validate new pair-specific candidates
        run: python -u scripts/discover_pair_candidates.py
      - name: Verify catalog integrity
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/games.json'))
          r=json.load(open('data/discovery-report.json'))
          assert len(d['games'])==r['catalog_total']
          assert len(set(g['id'] for g in d['games']))==len(d['games'])
          assert r['verified_promotions']==0
          print(r)
          PY
      - name: Commit new candidates and synced website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/games.json index.html data/discovery-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Discover PS5-PC candidate games and publish catalog'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
