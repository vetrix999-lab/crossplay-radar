name: Audit all GeForce NOW game statuses
on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1'
  push:
    paths:
      - 'scripts/audit_gfn.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all catalog games against GFN database
        run: python scripts/audit_gfn.py
      - name: Commit checked status and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json index.html data/gfn-audit.txt
          git diff --cached --quiet || (git commit -m "Update GFN title verification" && git push)
