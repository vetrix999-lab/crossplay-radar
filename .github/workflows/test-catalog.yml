name: Validate Crossplay Radar catalog and frontend
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/test_site_integrity.py'
      - 'data/games.json'
      - 'index.html'
      - '.github/workflows/test-catalog.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and check catalog and website
        run: |
          python -m py_compile scripts/test_site_integrity.py
          python scripts/test_site_integrity.py
